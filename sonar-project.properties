# Root project information
sonar.projectKey=hypergesture
sonar.projectName=HyperGesture
sonar.projectVersion=3.0.0
sonar.sourceEncoding=UTF-8

# Sources
sonar.sources=app/src/main/kotlin
sonar.tests=app/src/test/kotlin

sonar.java.binaries=app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes
sonar.java.source=21

# Produced by `gradle jacocoTestReport`.
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

# Exclusions
sonar.exclusions= \
  **/build/**, \
  **/generated/**

# Platform-bound layers are exercised on-device, not by JVM tests. The gesture
# recognizer is deliberately not excluded.
sonar.coverage.exclusions= \
  app/src/main/kotlin/io/github/victoresidoro/anygest/ui/**, \
  app/src/main/kotlin/io/github/victoresidoro/anygest/boot/**, \
  app/src/main/kotlin/io/github/victoresidoro/anygest/service/**, \
  app/src/main/kotlin/io/github/victoresidoro/anygest/diagnostics/**, \
  app/src/main/kotlin/io/github/victoresidoro/anygest/navigation/**, \
  app/src/main/kotlin/io/github/victoresidoro/anygest/settings/**
