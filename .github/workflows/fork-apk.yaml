# Builds this fork's signed release APK; on the release branch, publishes it as a GitHub Release.
# Fork-only helper: upstream's own CI runs on main/release branches and is untouched.
#
# Signing uses the same repository secrets as upstream's release workflow:
#   ANDROID_KEYSTORE_B64  the keystore, base64-encoded
#   KEYSTORE_PASSWORD     its store and key password (alias "hypergesture", the one inside the existing keystore)

name: Fork release APK

on:
  push:
    branches:
      - "circle-to-search"
      # Work in progress: tested and built into a downloadable APK, never published.
      - "dev/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Brasília time, so the files inside downloaded artifacts carry the maintainer's clock
  # instead of UTC (zip stores local time with no zone).
  TZ: America/Sao_Paulo
  DEV_DOCKER_ARGS: -v ${HOME:?}/ci-cache/gradle:/cache/gradle -e GRADLE_USER_HOME=/cache/gradle

jobs:
  checks:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image-action diffs against the base to spot image changes
      - name: Create the cache directories
        run: mkdir -p ~/ci-cache/gradle
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@1e296b26a16b3e20db153e32b963d953a41ef1a1 # v2
        with:
          docker-args: ${{ env.DEV_DOCKER_ARGS }}
      - name: Unit tests and lint
        run: |
          set -o pipefail
          $DEV_RUN -c 'gradle --no-daemon testDebugUnitTest lintDebug' 2>&1 | tee build.log
      # Logs are not always at hand where the build is reviewed, so the compiler, test and
      # lint errors are repeated as one annotation on the run's summary page.
      - name: Surface build errors
        if: failure()
        run: |
          {
            grep -E '^e: |FAILED|Exception|Error:|error:' build.log || true
            find app/build/reports -name 'lint-results-*.txt' -exec grep -E -A3 'Error' {} + 2>/dev/null || true
          } | head -80 >errors.txt
          if test -s errors.txt; then
            echo "::error title=Build errors::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)"
          fi
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7

  release-apk:
    name: Signed release APK
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 --decode >android.keystore
      # An unsigned or throwaway-signed APK would not install over the previous one, so a
      # missing secret stops the run instead of producing one.
      - name: Verify signing material is present
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -s android.keystore || {
            echo '::error::ANDROID_KEYSTORE_B64 is missing or not valid base64' && exit 1
          }
          test -n "${KEYSTORE_PASSWORD}" || {
            echo '::error::KEYSTORE_PASSWORD is missing' && exit 1
          }
      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          test -n "${version}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./scripts/build-apk.sh "${{ steps.version.outputs.version }}"
      - name: Verify the APK signature
        run: |
          docker run --rm --entrypoint bash \
            -v "${PWD}:/apk:ro" \
            "$(./scripts/devcontainer-image.sh)" \
            -c 'set -e
              apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort | tail -n1)"
              "${apksigner}" verify --print-certs /apk/anygest.apk'
      - name: Name the APK after its version
        run: mv anygest.apk "anygest-${{ steps.version.outputs.version }}.apk"
      - name: Upload the release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: anygest-${{ steps.version.outputs.version }}
          path: anygest-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90

  # Publishes a GitHub Release with the APK attached as-is (artifacts are always zipped).
  # One release per versionName: bump it to publish again. The tag is created with
  # GITHUB_TOKEN, which by design starts no other workflow, so upstream's own tag-triggered
  # release workflow stays idle in this fork.
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release-apk
    # Only the release branch publishes; dev/** builds stop at the workflow artifact.
    if: github.ref == 'refs/heads/circle-to-search'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read the version and look for an existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "exists=true" >>"${GITHUB_OUTPUT}"
            echo "::notice::Release v${version} already exists; bump versionName to publish a new one."
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi
      - name: Extract this version's changelog
        if: steps.release.outputs.exists == 'false'
        run: |
          awk -v v="## ${{ steps.release.outputs.version }}" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md >release-notes.md
          test -s release-notes.md
      - name: Download the release APK
        if: steps.release.outputs.exists == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: anygest-${{ steps.release.outputs.version }}
      # A fixed asset name keeps .../releases/latest/download/anygest.apk valid forever.
      - name: Give the APK its permanent name
        if: steps.release.outputs.exists == 'false'
        run: mv "anygest-${{ steps.release.outputs.version }}.apk" anygest.apk
      - name: Run softprops/action-gh-release
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AnyGest ${{ steps.release.outputs.version }}
          body_path: release-notes.md
          files: anygest.apk
          make_latest: true
